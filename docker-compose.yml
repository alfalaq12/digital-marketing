version: '3.8'

services:
  app:
    build: .
    container_name: digitalboost_app
    volumes:
      - .:/var/www/html
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: digitalboost_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: db_marketing
      MYSQL_USER: user_marketing
      MYSQL_PASSWORD: pass_marketing
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db_marketing.sql:/docker-entrypoint-initdb.d/db_marketing.sql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password

  web:
    image: nginx:latest
    container_name: digitalboost_nginx
    ports:
      - "9005:80"
    volumes:
      - .:/var/www/html
      - ./default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
      - db
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: digitalboost_phpmyadmin
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "8080:80"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  mysql_data:
